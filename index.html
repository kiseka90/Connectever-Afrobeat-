<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connectever Afrobeat</title>
    <style>
        :root {
            --bg-color: #121212;
            --sidebar-color: #040404;
            --card-color: #181818;
            --accent-color: #ff9800; /* Afrobeat Gold Accent */
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--sidebar-color);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282828;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 120px;
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        /* Ad Banner Area */
        .ad-banner {
            background: linear-gradient(90deg, #1f1c2c, #928dab);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 0.9rem;
            color: #fff;
            font-weight: bold;
        }

        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--card-color);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            transition: background 0.3s, transform 0.2s;
            cursor: pointer;
        }

        .card:hover {
            background-color: #282828;
            transform: scale(1.02);
        }

        .card img {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 6px;
            background-color: #333;
            object-fit: cover;
        }

        .card .track-title {
            font-weight: bold;
            font-size: 0.95rem;
            margin: 10px 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card .track-artist {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Bottom Persistent Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100px;
            background-color: #181818;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .now-playing {
            display: flex;
            align-items: center;
            width: 30%;
        }

        .now-playing img {
            width: 55px;
            height: 55px;
            border-radius: 4px;
            margin-right: 15px;
            background-color: #333;
        }

        .now-playing-info h4 {
            margin: 0;
            font-size: 0.9rem;
        }

        .now-playing-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 8px;
        }

        .btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .btn-play {
            background-color: var(--text-main);
            color: black;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
        }

            width: 100%;
