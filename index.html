<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connectever Afrobeat</title>
    <style>
        :root {
            --bg-color: #121212;
            --sidebar-color: #040404;
            --card-color: #181818;
            --accent-color: #ff9800; /* Afrobeat Gold Accent */
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--sidebar-color);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282828;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 120px;
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        /* Ad Banner Area */
        .ad-banner {
            background: linear-gradient(90deg, #1f1c2c, #928dab);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 0.9rem;
            color: #fff;
            font-weight: bold;
        }

        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--card-color);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            transition: background 0.3s, transform 0.2s;
            cursor: pointer;
        }

        .card:hover {
            background-color: #282828;
            transform: scale(1.02);
        }

        .card img {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 6px;
            background-color: #333;
            object-fit: cover;
        }

        .card .track-title {
            font-weight: bold;
            font-size: 0.95rem;
            margin: 10px 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card .track-artist {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Bottom Persistent Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100px;
            background-color: #181818;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .now-playing {
            display: flex;
            align-items: center;
            width: 30%;
        }

        .now-playing img {
            width: 55px;
            height: 55px;
            border-radius: 4px;
            margin-right: 15px;
            background-color: #333;
        }

        .now-playing-info h4 {
            margin: 0;
            font-size: 0.9rem;
        }

        .now-playing-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 8px;
        }

        .btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .btn-play {
            background-color: var(--text-main);
            color: black;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background-color: #535353;
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .progress {
            width: 0%;
            height: 100%;
            background-color: var(--accent-color);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Connectever Afrobeat</h1>
    </header>

    <div class="main-content">
        <!-- Sponsorship/Ad Placeholder -->
        <div class="ad-banner" id="adBanner">
            Sponsored Ad Loop: Listen Premium Quality Streams with Connectever Volume 1
        </div>

        <h2 class="section-title">Connectever Afrobeat Vol. 1 Playlist</h2>
        
        <div class="music-grid">
            <!-- Track Card 1 -->
            <div class="card" onclick="playTrack('Lagos Night Market', 'Connectever Mix', 'https://soundhelix.com', 'https://unsplash.com')">
                <img src="https://unsplash.com" alt="Cover Art">
                <div class="track-title">Lagos Night Market</div>
                <div class="track-artist">Connectever Mix</div>
            </div>
            <!-- Track Card 2 -->
            <div class="card" onclick="playTrack('Amapiano Fusion', 'Afrobeat Collective', 'https://soundhelix.com', 'https://unsplash.com')">
                <img src="https://unsplash.com" alt="Cover Art">
                <div class="track-title">Amapiano Fusion</div>
                <div class="track-artist">Afrobeat Collective</div>
            </div>
            <!-- Track Card 3 -->
            <div class="card" onclick="playTrack('Gidi Groove', 'Urban Stream Team', 'https://soundhelix.com', 'https://unsplash.com')">
                <img src="https://unsplash.com" alt="Cover Art">
                <div class="track-title">Gidi Groove</div>
                <div class="track-artist">Urban Stream Team</div>
            </div>
        </div>
    </div>

    <!-- Hidden HTML5 Audio Core Engine -->
    <audio id="audioEngine" src=""></audio>

    <!-- Bottom Streaming Player Bar -->
    <div class="player-bar">
        <div class="now-playing">
            <img id="currentCover" src="https://unsplash.com" alt="Current Track">
            <div class="now-playing-info">
                <h4 id="currentTitle">Select a Track</h4>
                <p id="currentArtist">Afrobeat System</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button class="btn">⏮</button>
                <button class="btn btn-play" id="playBtn" onclick="togglePlayback()">▶</button>
                <button class="btn">⏭</button>
            </div>
            <div class="progress-container">
                <span id="timeCurrent">0:00</span>
                <div class="progress-bar" id="progressBarContainer" onclick="seekAudio(event)">
                    <div class="progress" id="progressFill"></div>
                </div>
                <span id="timeTotal">0:00</span>
            </div>
        </div>

        <div style="width: 30%;"></div>
    </div>

    <!-- JavaScript Player Integration -->
    <script>
        const audio = document.getElementById('audioEngine');
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const timeCurrent = document.getElementById('timeCurrent');
        const timeTotal = document.getElementById('timeTotal');
        const currentTitle = document.getElementById('currentTitle');
        const currentArtist = document.getElementById('currentArtist');
        const currentCover = document.getElementById('currentCover');

        function playTrack(title, artist, streamUrl, coverUrl) {
            currentTitle.innerText = title;
            currentArtist.innerText = artist;
            currentCover.src = coverUrl;
            audio.src = streamUrl;
            audio.play();
            playBtn.innerText = '⏸';
        }

        function togglePlayback() {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
                playBtn.innerText = '⏸';
            } else {
                audio.pause();
                playBtn.innerText = '▶';
            }
        }

        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            timeCurrent.innerText = formatTime(audio.currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
