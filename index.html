<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connectever Afrobeat</title>
    <style>
        :root {
            --bg-color: #121212;
            --sidebar-color: #040404;
            --card-color: #181818;
            --accent-color: #1db954; /* Vibrant music green */
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Main Layout Header */
        header {
            background-color: var(--sidebar-color);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282828;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        /* Content Container */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 110px; /* Room for player bar */
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        /* Music Cards Grid */
        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--card-color);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            transition: background 0.3s;
            cursor: pointer;
        }

        .card:hover {
            background-color: #282828;
        }

        .card img {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 6px;
            background-color: #333;
            object-fit: cover;
        }

        .card .track-title {
            font-weight: bold;
            font-size: 0.95rem;
            margin: 10px 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card .track-artist {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Bottom Persistent Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background-color: #181818;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .now-playing {
            display: flex;
            align-items: center;
            width: 30%;
        }

        .now-playing img {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            margin-right: 15px;
            background-color: #333;
        }

        .now-playing-info h4 {
            margin: 0;
            font-size: 0.9rem;
        }

        .now-playing-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
        }

        .control-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 8px;
        }

        .btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .btn-play {
            background-color: white;
            color: black;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background-color: #535353;
            border-radius: 2px;
            position: relative;
        }

        .progress {
            width: 30%;
            height: 100%;
            background-color: var(--text-main);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Connectever Afrobeat</h1>
    </header>

    <div class="main-content">
        <h2 class="section-title">Trending Afrobeat Mixes</h2>
        
        <div class="music-grid">
            <!-- Card 1 -->
            <div class="card">
                <img src="https://placeholder.com" alt="Cover">
                <div class="track-title">Lagos Vibes</div>
                <div class="track-artist">Various Artists</div>
            </div>
            <!-- Card 2 -->
            <div class="card">
                <img src="https://placeholder.com" alt="Cover">
                <div class="track-title">Amapiano vs Afrobeat</div>
                <div class="track-artist">DJ Mix</div>
            </div>
            <!-- Card 3 -->
            <div class="card">
                <img src="https://placeholder.com" alt="Cover">
                <div class="track-title">Chill Afro Fusion</div>
                <div class="track-artist">Burna & Wiz Inspired</div>
            </div>
        </div>
    </div>

    <!-- Bottom Streaming Player Bar -->
    <div class="player-bar">
        <div class="now-playing">
            <img src="https://placeholder.com" alt="Current Track">
            <div class="now-playing-info">
                <h4>Lagos Vibes</h4>
                <p>Various Artists</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button class="btn">⏮</button>
                <button class="btn btn-play">▶</button>
                <button class="btn">⏭</button>
            </div>
            <div class="progress-container">
                <span>1:24</span>
                <div class="progress-bar">
                    <div class="progress"></div>
                </div>
                <span>3:45</span>
            </div>
        </div>

        <div style="width: 30%;"></div> <!-- Spacer for flex alignment -->
    </div>

</body>
</html>
